<html><head><script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Sr Staff Engineer, Backend - Core Services","description":"\u003cp>\u003cstrong>About the Role\u003c/strong>\u003c/p> \u003cp>As a Senior Staff Software Engineer, you are the Global Technical Anchor for systems powering every Uber trip and transaction. You define the multi-year vision for the backend ecosystem, acting as a peer to Directors and VPs to ground Uber’s most ambitious business goals in technical reality.\u003c/p> \u003cp>\u003cstrong>What You’ll Do\u003c/strong>\u003c/p> \u003cul> \u003cli>Technical Strategy: Define the \"North Star\" multi-year roadmap and lead high-stakes \"buy vs. build\" evaluations on the Architecture Review Board.\u003c/li> \u003cli>Execution & Excellence: Directly tackle high-risk challenges, driving a company-wide shift toward \"Zero-Trust\" and \"Always-On\" architectures.\u003c/li> \u003cli>Mentorship & Influence: Act as a \"leader of leaders\" by mentoring Staff Engineers and serving as a strategic advisor to VP/CTO level leadership.\u003c/li> \u003c/ul> \u003cp>\u003cstrong>Basic Qualifications\u003c/strong>\u003c/p> \u003cul> \u003cli>Experience: 12+ years of experience delivering massive-scale distributed systems.\u003c/li> \u003cli>Technical Depth: Expert-level understanding of distributed theory (CAP theorem, Paxos/Raft) and technical transformations.\u003c/li> \u003cli>Education: BS/MS/PhD in Computer Science or equivalent industry experience.\u003c/li> \u003c/ul> \u003cp>\u003cstrong>Preferred Qualifications\u003c/strong>\u003c/p> \u003cul> \u003cli>Open Source: Significant contributions to major open-source infrastructure or distributed systems projects.\u003c/li> \u003cli>Domain Expertise: Deep vertical expertise in FinTech or Security at a global \"Big Tech\" scale.\u003c/li> \u003cli>Architectural Migration: Experience migrating monolithic architectures to modular or cell-based paradigms.\u003c/li> \u003c/ul
