<html><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"apolloState": {"data": {"StartupResult:11255271": {"__typename": "StartupResult", "id": "11255271", "badges": [{"__ref": "Badge:ACTIVELY_HIRING"}, {"__ref": "Badge:QUICK_RESPONDER-11255271"}, {"__ref": "Badge:GROWING_FAST-11255271"}], "companySize": "SIZE_11_50", "highConcept": "Make any video you can think of", "highlightedJobListings": [{"__ref": "JobListingSearchResult:4787199"}], "logoUrl": "https://photos.wellfound.com/startups/i/11255271-04cc883693c87563b2c3f016b1270002-medium_jpg.jpg?buster=1790786174", "name": "cardboard.ai", "slug": "cardboard-ai"}, "JobListingSearchResult:4787199": {"__typename": "JobListingSearchResult", "autoPosted": false, "atsSource": "AtsIntegration::Ashby::Listing", "description": "## About\n\n- We're building the future of storytelling and video editing.\n- We're a small team that moves fast and builds things we're proud of.\n- We care obsessively about taste: in design, in product, in every detail.\n- We're solving [these](https://www.cardboard.ai/hard-problems) hard problems.\n- We're backed by a Tier-1 global fund, YC, and founders of billion dollar companies.\n\n## Engineering\n\nCardboard is a video editor you can talk to. Behind it are proxy transcodes, parallel exports, GPU analysis, AI generation, and the credits that pay for it all.\n\nWe're hiring a Backend Engineer to own those systems as products, measured by how fast they are, how often they fail, and what they cost.\n\n## What you'll own\n\n- Exports, media processing, and generation.\n- Long-running jobs that recover on their own and report honest progress.\n- Credits and usage, charged fairly and never twice.\n\n## Who you are\n\n- You've owned production backend systems while the product kept changing.\n- You think clearly about state, queues, and workers, and you care about cost as much as speed.\n- You're strong in TypeScript, and comfortable in Python.\n- Bonus: deep FFmpeg or codec experience.\n\n## How we work\n\n- You own outcomes, not tickets: decide what to build, ship it, and check it worked.\n- You talk to users and look at the data.\n- You build with AI agents every day, and you're the taste and judgment in the loop.\n\n## What success looks like\n\nWithin your first six months:\n\n- Exports and processing are measurably faster and fail less often.\n- You know what each kind of job costs us, and the biggest costs have come down.\n\n## What you get\n\nYou'd be surrounded by people who are absurdly good at what they do. One started coding at 11 and shipped an app with 6M+ downloads in high school. One got into CS engineering at 14 and has been working on distributed systems for 8+ years. One's an ex-founder who took a company to 1.2M users and $300M+ in transactions. That's the team. We're looking for someone who'll raise the bar on technical craftsmanship and product quality. Apart from that you'd get:\n\n- Competitive salary and founding-team equity.\n- Unlimited tokens across every AI model. Use whatever you want, as much as you want.\n- A healthy budget for AI tools and any peripherals you need to do your best work.\n", "jobType": "full-time", "liveStartAt": 1790899690, "locationNames": ["Bengaluru"], "primaryRoleTitle": "Software Engineer", "remote": false, "remoteConfig": {"__typename": "JobListingRemoteConfig", "kind": "ONSITE", "wfhFlexible": false}, "acceptedRemoteLocationNames": [], "slug": "backend-engineer", "title": "Backend Engineer", "compensation": "", "yearsExperienceMin": 3, "yearsExperienceMax": null, "id": "4787199", "isBookmarked": false}, "StartupResult:11139096": {"__typename": "StartupResult", "id": "11139096", "badges": [{"__ref": "Badge:ACTIVELY_HIRING"}, {"__ref": "Badge:GROWING_FAST-11139096"}], "companySize": "SIZE_11_50", "highConcept": "CredX is building the trust layer for modern hiring. Hiring today is overloaded with resumes, unveil", "highlightedJobListings": [{"__ref": "JobListingSearchResult:4817672"}, {"__ref": "JobListingSearchResult:4817670"}], "logoUrl": "https://photos.wellfound.com/startups/i/11139096-0946a9c21ae3b8b9a3f3c04a6fc54039-medium_jpg.jpg?buster=1785478755", "name": "CredX", "slug": "credx-3"}, "JobListingSearchResult:4817672": {"__typename": "JobListingSearchResult", "autoPosted": false, "atsSource": null, "description": "**Job Title: Senior Backend Engineer (Java, Spring Boot)**\nCompany: CredX\nDepartment: Engineering\nLocation: Hyderabad, Telangana (Onsite, Capital Park, Madhapur)\nEmployment Type: Full Time\nExperience: 4 to 6 Years\nReporting To: Founder and CEO\n \n**About the Company**\nCredX is a verification-first hiring platform for the Indian market. All candidates on the platform have their backgrounds verified across identity, education, and employment before their applications reach employers, and all employers are verified before publishing jobs. CredX is incorporated in the United States, with its product and engineering team based in Hyderabad.\n\n**Job Summary**\nCredX is seeking a Founding Backend Engineer to take ownership of its backend platform. The role involves leading the platform through production launch and managing its architecture, reliability, security, and scalability. The position offers a clear growth path into engineering leadership as the team expands.\n\n**Key Responsibilities**\n\n* Own the design, development, and maintenance of the backend platform\n* Develop and maintain billing and payment workflows, ensuring accuracy and reliability\n* Implement and maintain role based access control and secure handling of sensitive data\n* Design and optimize database schemas and queries\n* Write unit and integration tests for critical business flows\n* Manage deployments, monitoring, and resolution of production issues\n* Collaborate with the frontend team to define and maintain API contracts\n* Maintain technical documentation and coding standards\n\n**Required Skills and Qualifications**\n\n* 4 to 6 years of professional experience in Java and Spring Boot\n* Hands on experience with payment gateway integration and transaction processing\n* Strong knowledge of PostgreSQL, including schema design, indexing, and query optimization\n* Experience with Spring Security, JWT, and role based access control\n* Experience building and maintaining RESTful APIs\n* Strong problem solving skills and the ability to work independently\n\n**Preferred Qualifications**\n\n* Experience with Razorpay\n* Working knowledge of AWS and Microsoft Azure\n* Experience with Docker and CI/CD pipelines\n* Experience with database migration tools such as Flyway or Liquibase\n* Prior experience in a startup environment\n\n**Education**\nB.E. / B.Tech / M.Tech / MCA in Computer Science or a related field\n \n**Technology Stack**\nJava 17, Spring Boot 3, PostgreSQL, Spring Security, Razorpay, AWS, Microsoft Azure, Docker, GitHub Actions\n \n**What We Offer**\n\n* Founding team role with a growth path into engineering leadership\n* Direct collaboration with the founder\n\n**Selection Process**\n\n1. Screening Call\n2. Technical Interview with the Founder\n3. Paid Technical Assignment\n4. Final Discussion and Offer\n\n**How to Apply**\nInterested candidates may send their resume to [connect@credxhire.com]", "jobType": "full-time", "liveStartAt": 1791365007, "locationNames": ["Hyderabad"], "primaryRoleTitle": "Backend Engineer", "remote": false, "remoteConfig": {"__typename": "JobListingRemoteConfig", "kind": "ONSITE", "wfhFlexible": false}, "acceptedRemoteLocationNames": [], "slug": "backend-engineer", "title": "Backend engineer", "compensation": "\u20b912L \u2013 \u20b915L \u2022 No equity", "yearsExperienceMin": 4, "yearsExperienceMax": null, "id": "4817672", "isBookmarked": false}, "JobListingSearchResult:4817670": {"__typename": "JobListingSearchResult", "autoPosted": false, "atsSource": null, "description": "Job Title: Founding Frontend Engineer (Angular)\nCompany: CredX\nDepartment: Engineering\nLocation: Hyderabad, Telangana (Onsite, Capital Park, Madhapur)\nEmployment Type: Full Time\nExperience: 3 to 6 Years\nReporting To: Founder and CEO\n\n**About the Company**\nCredX is a verification-first hiring platform for the Indian market. All candidates on the platform have their backgrounds verified across identity, education, and employment before their applications reach employers, and all employers are verified before publishing jobs. CredX is incorporated in the United States, with its product and engineering team based in Hyderabad.\n\n**Job Summary**\nCredX is seeking a founding frontend engineer to develop and own its web application across the job seeker, employer, and verification products. The application is built on Angular with an in-house design system. The role involves building new features, maintaining UI quality and performance, and taking ownership of the frontend as the platform grows.\n\n**Key Responsibilities**\n* Develop and maintain frontend features from design handoff to production deployment\n* Build responsive, high-quality user interfaces using Angular\n* Extend and maintain the in-house design system and component library\n* Implement role-based screens and access controls for multiple user types\n* Develop complex multi-step forms with validation\n* Integrate frontend workflows with backend APIs and payment gateways\n* Write unit and end-to-end tests and maintain code quality standards\n* Collaborate with designers and backend engineers to deliver product requirements\n\n**Required Skills and Qualifications**\n\n* 3 to 6 years of professional experience in Angular on the production \n* Hands-on experience with standalone components and Angular Signals\n* Strong knowledge of TypeScript and RxJS\n* Experience with reactive forms and form validation\n* Experience integrating RESTful APIs\n* Strong attention to UI detail and responsive design\n\n**Preferred Qualifications**\n\n* Experience with Tailwind CSS and Angular Material\n* Experience building role-based applications\n* Experience with payment gateway integration (Razorpay or Stripe)\n* Experience with Jasmine, Karma, or Cypress\n* Prior experience in a startup environment\n\n**Education**\nB.E./B.Tech./M.Tech./MCA in Computer Science or a related field\nTechnology Stack\n Angular 20, TypeScript, RxJS, Angular Material, Tailwind CSS, Jasmine, Cypress, AWS, Microsoft Azure\n \n**What We Offer**\n* Founding team role with ownership of the frontend platform\n* Direct collaboration with the founder\n\n**Selection Process**\n\n1. Screening Call\n2. Technical Interview with the Founder\n3. Paid Technical Assignment\n4. Final Discussion and Offer\n\nHow to Apply\nInterested candidates may send their resume to [connect@credxhire.com]", "jobType": "full-time", "liveStartAt": 1791364380, "locationNames": ["Hyderabad"], "primaryRoleTitle": "Frontend Engineer", "remote": false, "remoteConfig": {"__typename": "JobListingRemoteConfig", "kind": "ONSITE", "wfhFlexible": false}, "acceptedRemoteLocationNames": [], "slug": "frontend-engineer", "title": "Frontend Engineer", "compensation": "\u20b910L \u2013 \u20b914L \u2022 No equity", "yearsExperienceMin": 4, "yearsExperienceMax": null, "id": "4817670", "isBookmarked": false}}}}}}</script></body></html>
