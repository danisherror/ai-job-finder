<script type="application/ld+json">{"hiringOrganization":{"@type":"Organization","name":"IDeaS","sameAs":"https://ideas.com/"},"validThrough":"2027-01-22T05:00:00.000Z","jobLocation":[{"address":{"addressCountry":"AE","streetAddress":"UNAVAILABLE","@type":"PostalAddress","postalCode":"UNAVAILABLE","addressLocality":"Dubai","addressRegion":"UNAVAILABLE","postOfficeBoxNumber":"UNAVAILABLE"},"@type":"Place"}],"employmentType":"OTHER","@type":"JobPosting","description":"<h2><\/h2>\n<p><\/p>\n<p>&nbsp;<\/p>\n<p>The Consulting Solution Engineer (CSE) is a hybrid role that combines pre-sales Solution Engineering, lightweight consulting, and early post-sales value enablement to support the successful acquisition, deployment, and long-term adoption of IDeaS solutions in the Middle East market.This role is designed to address the unique needs of the Middle East, where customers often expect deeper domain expertise, continuity across the buying and onboarding journey, and hands-on guidance during early stages of adoption. This role applies strong hospitality domain knowledge and revenue management expertise to understand customer business objectives, guide buying journeys, and design solutions that deliver measurable commercial value. The CSE partners closely with Sales, Account Management, Solution Engineering, and Consulting to shape solutions, de-risk complex opportunities, and ensure clients are positioned for success and actively partners with post-sales delivery teams to support a smooth transition into implementation and early adoption, ensuring clarity of solution intent and identified risks.The Consulting Solution Engineer operates as a trusted technical and business advisor to prospects and customers, applying strong hospitality and revenue management expertise, cultural fluency, and local market knowledge to deliver measurable value. This role operates with autonomy within defined opportunity scope and serves as an execution partner for individual clients and prospects within the regional go-to-market organization.<\/p>\n<p><strong><em>What you\u2019ll be doing...<\/em><\/strong><\/p>\n<p>&nbsp;<\/p>\n<p><strong>Customer &amp; Buyer Engagement<\/strong><\/p>\n<p>&nbsp;<\/p>\n<p>\u2022 Position IDeaS as a trusted business partner by clearly articulating how solutions address customer commercial objectives, including revenue growth, efficiency, consistency, and scalability.\u2022 Lead and support pre-sales discovery, solution design, and value articulation for prospective clients.\u2022 Design and deliver high-impact, customer-relevant demonstrations, presentations, and workshops aligned to buyer objectives and evaluation criteria.\u2022 Actively support and influence customer buying journeys by understanding evaluation criteria, stakeholder dynamics, and decision-making processes.\u2022 Support and, where appropriate, lead executive-level solution discussions for opportunities, ensuring alignment between customer objectives and IDeaS value propositions.\u2022 Navigate culturally nuanced stakeholder environments, ensuring alignment and clarity across Middle Eastern client organizations.<\/p>\n<p>&nbsp;<\/p>\n<p><strong>Solution Design &amp; Delivery Excellence<\/strong><\/p>\n<p>\u2022 Architect and document appropriate solutions across IDeaS products and features based on customer needs, technical constraints, operational maturity, and strategic goals.\u2022 Qualify, prepare, and deliver pre-sales presentations, including readiness for revenue management tools, implementation approach, and proof of concept / ROI narratives.\u2022 Ensure solution integrity across integrations, data flows, and deployment assumptions during the sales process.\u2022 Act as a senior technical resource on complex opportunities involving multiple systems or stakeholders.<\/p>\n<p>&nbsp;<\/p>\n<p><strong>Commercial Partnership &amp; Execution<\/strong><\/p>\n<p>&nbsp;<\/p>\n<p>\u2022 Partner with Sales and Account Management to develop account strategies, assess customer needs, and address critical issues to support regional goals.\u2022 Contribute to deal strategy, including solution positioning, risk identification, and competitive differentiation.\u2022 Manage, lead, and contribute to RFx and Security Assessment responses, ensuring solution accuracy, consistency, and alignment to customer requirements in partnership with other teams.<\/p>\n<p>&nbsp;<\/p>\n<p><strong>Consulting\u2011Led Discovery &amp; Advisory Support<\/strong><\/p>\n<p>&nbsp;<\/p>\n<p>\u2022 Apply structured consulting techniques to assess customer revenue management processes, organizational readiness, and adoption risks.\u2022 Provide advisory recommendations on revenue management strategy, process improvement, and best\u2011practice adoption tailored to Middle Eastern operating environments.\u2022 Facilitate scoped discovery or advisory workshops that help customers understand how to operationalize IDeaS solutions effectively.\u2022 Support definition of success metrics, KPIs, and value hypotheses during the sales and onboarding phases.\u2022 Perform structured quantitative and qualitative analysis to identify revenue, process, and adoption improvement opportunities.\u2022 Support development of business cases, ROI narratives, and impact assessments tied to consulting recommendations.<\/p>\n<p>&nbsp;<\/p>\n<p><strong>Early Post\u2011Sales Enablement &amp; Value Readiness<\/strong><\/p>\n<p>&nbsp;<\/p>\n<p>\u2022 Provide continuity from pre\u2011sales into early post\u2011sale phases by clearly documenting solution intent, assumptions, and identified risks.\u2022 Partner with Solution Success Consultants and delivery teams during initial onboarding or pilot phases to ensure alignment to the sold solution.\u2022 Offer time\u2011bound, advisory post\u2011sale support focused on value readiness, adoption guidance, and clarification of strategy.\u2022 Proactively identify and escalate risks, gaps, or misalignment to the appropriate post\u2011sales owners.<\/p>\n<p>&nbsp;<\/p>\n<p><strong>Market, Industry &amp; Competitive Insight<\/strong><\/p>\n<p>&nbsp;<\/p>\n<p>\u2022 Apply industry best practices and revenue management expertise to tailor solutions for specific customer segments, portfolios, and regions.\u2022 Maintain strong awareness of competitive solutions and market dynamics to support effective competitive positioning.\u2022 Investigate and evaluate emerging technologies, including IDeaS partners and competitive offerings, to inform solution design and sales strategy.\u2022 Maintain deep knowledge of the Middle Eastern hospitality market, including local business practices, technology ecosystems, and regulatory considerations.\u2022 Maintain expert knowledge of IDeaS solutions and their integration with PMS, CRS, channel management, and data platforms commonly used in the Middle East.<\/p>\n<p>&nbsp;<\/p>\n<p><strong>Internal Collaboration &amp; Leadership<\/strong><\/p>\n<p>&nbsp;<\/p>\n<p>\u2022 Act as technical lead on assigned opportunities, coordinating with Product, Integrations, Consulting, Client Services and Partner teams as required.\u2022 Act as a cultural and market liaison between global teams and customers in the Middle East, providing structured feedback on local needs and expectations.\u2022 Contribute to internal best practices, enablement materials, and continuous improvement initiatives relevant to the Middle East market.\u2022 Mentor regional resources on Middle Eastern\u2011specific client requirements and practices, where appropriate.\u2022 Contribute to regional and global Solution Engineering initiatives, sharing best practices and supporting continuous improvement.\u2022 Support marketing events, trade shows, and user group meetings as needed.\u2022 Performs other duties as assigned.<\/p>\n<p>&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<p><strong><em>What you\u2019ll bring to us\u2026<\/em><\/strong><\/p>\n<p>&nbsp;<\/p>\n<ul>\n <li>8+ years of progressive experience in hospitality, distribution, and revenue management, including exposure to automated revenue management systems.<\/li>\n <li>Preferred: 3+ years of experience in technical sales, consulting, solution engineering, technical support, training, implementation, project management or related roles.<\/li>\n <li>Bi-lingual Arabic and English Speaker, (Arabic Native or Professional Fluency level speaking)<\/li>\n <li>Strong understanding of hospitality revenue management concepts, pricing, distribution, and forecasting.<\/li>\n <li>Working knowledge of hotel technology ecosystems, including PMS, CRS, channel management, and related systems.<\/li>\n <li>Proven ability to communicate complex technical and business concepts clearly to executive and non-technical audiences.<\/li>\n <li>Demonstrated experience delivering effective product demonstrations and solution presentations.<\/li>\n <li>Solid commercial acumen with the ability to align solutions to customer business outcomes.<\/li>\n <li>Strong presentation, facilitation, and stakeholder management skills.<\/li>\n <li>Ability to travel 25%<\/li>\n<\/ul>\n<p>&nbsp;<\/p>\n<p><strong><em>Who we are....<\/em><\/strong><\/p>\n<p>Passionate people. Loyal clients. Leading solutions.<\/p>\n<p>With a rich culture of creative collaboration and professional growth, IDeaS\u2019 team members build successful careers with us. <\/p>\n<p>IDeaS is proud to be a global powerhouse of innovation and excellence; challenge and reward. No matter where we\u2019re working, our teams come together to create leading revenue management solutions that accelerate our clients\u2019 growth through revenue optimization.<\/p>\n<p><strong><em>We Support Who You Are\u2026.<\/em><\/strong><\/p>\n<p>As a global company, we strive to create an inclusive environment where diverse perspectives spark innovation and meet the challenges of an evolving world.&nbsp; Whether you\u2019re launching a new career or expanding your current one, IDeaS is a company where you can balance great work with all other aspects of your life.&nbsp; <\/p>\n<p>At IDeaS, we also aspire to live our values each day by being Accountable, Curious, Passionate and Authentic. And we continue our quest to build a more inclusive environment that attracts, represents and provides a place for diverse ideas, unique perspectives, and authentic voices.&nbsp; <\/p>\n<p><strong><em>Additional Information:<\/em><\/strong>To qualify, applicants must be legally authorized to work in UAE, and should not require, now or in the future, sponsorship for employment visa status.<\/p>\n<p>All qualified applicants are considered for employment without regard to race, color, religion, gender, sexual orientation, gender identity, age, national origin, disability status, protected veteran status or any other characteristic protected by law.&nbsp;<\/p>\n<p>Equivalent combination of education, training, and relevant experience may be considered in place of the education requirement stated above.<\/p>\n<p>Resumes may be considered in the order they are received.<\/p>\n<p>IDeaS/SAS employees performing certain job functions may require access to technology or software subject to export or import regulations. To comply with these regulations, IDeaS/SAS may obtain nationality or citizenship information from applicants for employment. IDeaS/SAS collects this information solely for trade law compliance purposes and does not use it to discriminate unfairly in the hiring process.<\/p>\n<p>#IDeaS<\/p>","directApply":true,"datePosted":"2026-01-22T05:00:00.000Z","title":"Consulting Solution Engineer","occupationalCategory":"IDeaS (a SAS company)","@context":"http://schema.org","url":"https://ideasglobal-sas.icims.com/jobs/41212/consulting-solution-engineer/job"}</script>
