ministration, you’re comfortable navigating the intricacies of Apex, Visualforce, and Lightning Web Components. You are proactive about monitoring new Salesforce features and enjoy partnering across technology teams to deliver the best possible outcomes. Your drive for excellence ensures you consistently deliver high-quality results, and you’re excited by opportunities to grow and contribute to moderately complex projects. Whether working independently or as part of a dynamic group, you set high standards for yourself and support others in achieving shared goals.</p><h3 style='margin-top:14.0pt;margin-right:0cm;margin-bottom:4.0pt;margin-left:0cm;font-size:14pt;font-family:Roboto;'>What You’ll Be Doing:</h3><ul style='margin-bottom:0cm;margin-top:0cm;' type='disc'><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Developing, implementing, and maintaining Salesforce customizations, applications, extensions, and integrations to optimize business processes.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Collaborating with customers, IT colleagues, and stakeholders to identify user requirements and recommend effective technical solutions.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Working on end-to-end Salesforce projects, including Community implementation and advanced Lightning development.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Designing, coding, testing, debugging, and documenting Salesforce programs, including Apex Classes, Visualforce Pages, and Lightning Web Components.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Monitoring project activities, reporting statuses, identifying issues, and implementing corrective actions to ensure project success.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Creating and modifying controllers, triggers, workflows, approvals, flows, and reports, leveraging Salesforce APIs and web services for seamless integration.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Performing operational support, enhancements, and bug fixes to maintain the reliability and scalability of the Salesforce platform.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Staying up-to-date on Salesforce releases, features, and product roadmaps, and applying new tools and methodologies such as Copado or GitLab.</li></ul><h3 style='margin-top:14.0pt;margin-right:0cm;margin-bottom:4.0pt;margin-left:0cm;font-size:14pt;font-family:Roboto;'>The Impact You Will Have:</h3><ul style='margin-bottom:0cm;margin-top:0cm;' type='disc'><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Enabling Synopsys teams to operate more efficiently through robust and scalable Salesforce solutions.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Enhancing business application performance, reliability, and user experience across the organization.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Driving digital transformation by integrating modern cloud technologies and best practices.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margi e-height:12.0pt;font-size:11pt;font-family: initial;'>Experience with deployment tools and methodologies such as Copado or GitLab.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Strong understanding of Salesforce API, web services (SOAP/REST), and integration techniques.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Salesforce.com certifications (Certified Administrator, Platform Developer I &amp; II) are highly desirable.</li></ul><h3 style='margin-top:14.0pt;margin-right:0cm;margin-bottom:4.0pt;margin-left:0cm;font-size:14pt;font-family:Roboto;'>Who You Are:</h3><ul style='margin-bottom:0cm;margin-top:0cm;' type='disc'><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Excellent communicator—able to convey technical concepts in business terms and collaborate effectively with diverse teams.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Analytical thinker with strong problem-solving skills and unbiased judgment.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Self-starter who thrives both autonomously and in team-driven, task-oriented projects.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Adaptable, resourceful, and eager to learn new technologies and methodologies.</li><li style='margin-top:0cm;margin-right:0cm;margin-bottom:6.0pt;margin-left:0cm;line-height:12.0pt;font-size:11pt;font-family: initial;'>Detail-oriented and capable of managing multiple priorities with professionalism.</li><li style='margin-top:0cm;margin-rig
