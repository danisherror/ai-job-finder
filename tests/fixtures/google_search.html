<html><script>AF_initDataCallback({key: 'ds:1', hash: '2', data:[[["74056712658526918", "Physical Design and Implementation Engineer, GPU", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckbDXHxakggkwnrrXAQXQeGEPXkX7xeSWw7zItIZFlg3kEjsA9yzvgiwRZFxVgsKMyn7qQktQx1ns0AJxyvGzJhOALakPi2sdT-EGfq_GM_DDUTHQYO7tS0SUdpjAUw%3D%3D_V2&loc=IN&title=Physical+Design+and+Implementation+Engineer", [null, "<ul>\n<li>Develop all aspects of ASIC RTL2GDS implementation for high Power, Performance, and Area (PPA) designs.</li>\n<li>Manage block and full-chip level physical implementation and quality of results (power, timing, area).</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree in Engineering or equivalent practical experience.</li>\n<li>8 years of experience in physical design engineering.</li>\n<li>Experience with high performance designs.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Master's degree in Engineering or related field.</li>\n<li>Experience in power optimization.<br></li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Bengaluru, Karnataka, India", ["216, 6th Main Rd, Kamadhenu Nagar, B Narayanapura, Mahadevapura, Bengaluru, Karnataka 560016, India"], "Bengaluru", "560016", "KA", "IN"]], [null, "Be part of a team that pushes boundaries, developing custom silicon solutions that power the future of Google's direct-to-consumer products. You'll contribute to the innovation behind products loved by millions worldwide. Your expertise will shape the next generation of hardware experiences, delivering unparalleled performance, efficiency, and integration.<p>Google's mission is to organize the world's information and make it universally accessible and useful. Our team combines the best of Google AI, Software, and Hardware to create radically helpful experiences. We research, design, and develop new technologies and hardware to make computing faster, seamless, and more powerful. We aim to make people's lives better through technology.</p>"], [2, 3], [1792798722, 873000000], [1792798722, 873000000], [1792798722, 936000000], [null, "In most instances, this position requires in-person interviews as part of the hiring process."], null, null, [null, ""], [null, "<ul>\n<li>Bachelor's degree in Engineering or equivalent practical experience.</li>\n<li>8 years of experience in physical design engineering.</li>\n<li>Experience with high performance designs.</li>\n</ul>"], 2], ["136809277229540038", "Head of RCS for Business Partnerships", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckeP-kvHpyxhB5nOFJLShWqKciP7sEC_L0MYG0ruw5HXwEjsA9yzvgvuF2ei6eqNqp3aChsaOmtBHGDZME55WWRJlQ8q8tnv0ki4oallQXmjqm1mC56vcVNV7bt1mYw%3D%3D_V2&loc=IN&title=Head+of+RCS+for+Business+Partnerships", [null, "<ul>\n<li>Own business health, revenue enablement strategy, and adoption metrics for RCS for Business. Formulate and execute the multi-year partner roadmap.</li>\n<li>Drive alignment across competing market players to build a frictionless RCS ecosystem. Accelerate enterprise brand adoption by partnering with companies to launch flagship, industry-first conversational commerce experiences with leading brands.</li>\n<li>Serve as a strategic advisor to global Product and Engineering leadership, translating local market regulatory nuances, technical hurdles, and partner dynamics into high-priority product requirements.</li>\n<li>Represent Google as the preeminent thought leader for RCS and business messaging at major European industry events, regulatory discussions, and executive roundtables.</li>\n<li>Mentor and strategically guide local and regional partner managers. Establish best practices, repeatable commercial frameworks, and negotiation playbooks for the broader India partnerships team.</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree or equivalent practical experience.<br></li>\n<li>10 years of experience in business development, partnerships, management consulting, or investment banking.</li>\n<li>Experience in the Consumer Electronics, Auto, OEMs, Telecom, E-Commerce/Retail, Apps, Ads, Gaming, or Technology industries.</li>\n<li>Experience working with C-level executives and cross-functionally across all levels of management.<br></li>\n<li>Experience managing agreements or partnerships.<br></li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Master's degree or other advanced degree.<br></li>\n<li>Experience with messaging, omni-channel marketing, local digital advertising, across the region and market.</li>\n<li>Experience leading cross-functional teams (e.g., Product, Engineering, Legal, Regulatory, and Sales) to deliver complex initiatives.</li>\n<li>Experience mentoring, coaching, or formally managing junior partner development managers or account teams.</li>\n<li>Ability to pitch to, negotiate with, and influence C-suite executives externally and senior VPs internally.</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Bengaluru, Karnataka, India", ["216, 6th Main Rd, Kamadhenu Nagar, B Narayanapura, Mahadevapura, Bengaluru, Karnataka 560016, India"], "Bengaluru", "560016", "KA", "IN"], ["Mumbai, Maharashtra, India", ["Mumbai, Maharashtra, India"], "Mumbai", null, "MH", "IN"]], [null, "<p>Google's line of products and services to our clients never stops growing. The Partnerships Development team is responsible for seeking and exploring new opportunities with Google's partners. Equipped with your business acumen and extensive product knowledge, you are right on the front line of interacting with our partners, and helping them find ways to grow using Google's newest product offerings. Your knowledge of relevant verticals and relationships with key industry players will help shape our great applications and content for products such as YouTube, Google TV and Commerce.</p>\n<p>As the Lead for RCS for Business Partnerships, you will be the strategic architect for the next generation of mobile conversational commerce. Google is transforming consumer-to-business interaction through Rich Communication Services (RCS) across both Android and iOS devices. You will be responsible for defining the growth trajectory, commercial frameworks, and ecosystem strategy to make RCS the leading business-to-consumer messaging channel.<br><br>In this role, you will navigate a consolidated communications and conversational AI ecosystem. You will lead engagements with the executive leadership spanning AI-native botbuilders and CSPs, Martechs, Communications Platform as a Service (CPaaS) providers, messaging aggregators, and enterprise brands. You will architect the commercial and policy environments required to scale the business ecosystem sustainably. You will act as a critical bridge between local market realities and global product and business leadership.</p><p>The Global Partnerships organization is responsible for exploring new opportunities with Google's partners. Google’s Global Partnerships team works with a wide range of partners to bring the best of Google to power their business. The Global Partnerships team supports Google’s own Product teams with essential partnerships to help Google’s user experiences in advertising, Search, Assistant, Maps, Travel, Shopping, Payments and more. Teams create product-enabling partnerships, go-to-market strategies and incubate business growth for a variety of products.</p>"], [3, 2], [1792789726, 629000000], [1792789726, 629000000], [1792789726, 703000000], [null, ""], null, null, [null, "Note: By applying to this position you will have an opportunity to share your preferred working location from the following: <b>Bengaluru, Karnataka, India; Mumbai, Maharashtra, India</b>."], [null, "<ul>\n<li>Bachelor's degree or equivalent practical experience.<br></li>\n<li>10 years of experience in business development, partnerships, management consulting, or investment banking.</li>\n<li>Experience in the Consumer Electronics, Auto, OEMs, Telecom, E-Commerce/Retail, Apps, Ads, Gaming, or Technology industries.</li>\n<li>Experience working with C-level executives and cross-functionally across all levels of management.<br></li>\n<li>Experience managing agreements or partnerships.<br></li>\n</ul>"], 3]], null, 2, 20], sideChannel: {}});</script></html>
