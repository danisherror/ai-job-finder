# Companies to collect jobs from.
# type: greenhouse | lever | ashby | smartrecruiters | workday | workable | himalayas
#       | amazon | oracle | eightfold | rippling
# board: the company's board name on that ATS (checked live 2026-10-23)
#   smartrecruiters: the company identifier in api.smartrecruiters.com/v1/companies/<id>
#   workday: the full career site URL, e.g. https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
#   himalayas: a country name; this is a job board covering many companies (remote jobs open to that country)
# SmartRecruiters and Workday only collect India jobs, and fetch each new job's page once (first scan is slow).

