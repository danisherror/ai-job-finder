# Companies to collect jobs from.
# type: greenhouse | lever | ashby | smartrecruiters | workday | workable | himalayas
#       | amazon | oracle | eightfold | rippling | weworkremotely | ycombinator | jibe
#       | remoteok | remotive | workingnomads | jobspresso | hasjob | hackernews | jooble | careerjet
#       | atlassian | ripplehire | phenom | avature | talentbrew | icims | socgen | jobicy | adzuna
# board: the company's board name on that ATS (checked live 2026-10-23)
#   smartrecruiters: the company identifier in api.smartrecruiters.com/v1/companies/<id>
#   workday: the full career site URL, e.g. https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
#   himalayas: a country name; this is a job board covering many companies (remote jobs open to that country)
#   jooble, careerjet, adzuna: search keywords, several separated by "|" (India only; need an API key in .env)
#   ripplehire: the career site link with its token, plus "#list/geo=India" where the site has that filter
#   phenom: the career site URL with its locale path, e.g. https://careers.nttdata.com/global/en
#   avature: the portal URL plus ?search=<words>, e.g. https://jobs.siemens.com/en_US/externaljobs?search=India
#   talentbrew, icims, socgen: the career site's base URL (read through its sitemap and job pages)
# SmartRecruiters and Workday only collect India jobs, and fetch each new job's page once (first scan is slow).
# max_jobs: optional cap on India jobs read per scan for Workday, Oracle and Eightfold (default 1,000).

