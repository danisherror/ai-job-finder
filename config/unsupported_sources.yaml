- group: no_readable_job_list
  kind: company
  reason: >-
    Checked 2026-10-25: the career page loads its jobs in the browser from a source not found, or
    shows a bot check. Most of these companies' jobs also reach the tool through LinkedIn, Naukri
    (AmbitionBox), Instahyre or Hirist.
  could_add: maybe, with more digging per site or a headless browser
  names:
    - SAP (new jobs.sap.com site; jobs loaded by script)
    - Globant (SuccessFactors-based, but its search page returns 404)
    - Walmart (careers.walmart.com is US only; its India Workday site returns errors)
    - TCS (HTTP 403)
    - PhonePe (job list loaded by script)
    - Zomato / Eternal (no job list found)
    - Zepto (bot check)
    - Myntra (WordPress site; no job list found)
    - most other Indian startups

- group: no_india_jobs
  kind: company
  reason: Public job board works, but it had no India jobs.
  could_add: yes, one line in sources.yaml if they start hiring in India
  names: [Thoughtworks, Pinterest, Riot Games, Netcracker, Hugging Face, Circle]

- group: too_few_india_jobs
  kind: company
  reason: Fewer than about 2 India jobs a month, so not worth a scan.
  could_add: yes, one line in sources.yaml
  names: [Samsara, Brex, Starburst, Cockroach Labs]

- group: unclear_or_off_target
  kind: company
  reason: Board is unclear or its India-region jobs are not what we want.
  could_add: no
  names:
    - OKX ("APAC" jobs are mostly Pakistan / Southeast Asia crypto sales)
    - Binance (two boards with that name; unclear which is the real one)
