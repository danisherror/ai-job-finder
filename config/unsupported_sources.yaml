# Companies and job portals this tool does NOT collect jobs from, and why.
# This file is a record only; the tool never reads it. Sources it does collect from are in sources.yaml.
# Checked 2026-10-23 to 2026-10-24; re-checked 2026-10-25 with a normal browser User-Agent and with
# robots.txt rules set aside on purpose (the owner asked for every source that can be read).
# A site may change, so a "blocked" or "no API" entry can be re-checked later.
#
# Each group has a reason and the names it applies to. "could_add" says whether it can be added later and how.

# Added 2026-10-25 with new readers, so no longer listed here (several had been listed as blocked only
# because they refuse this tool's own User-Agent; they answer a normal browser):
#   Portals: LinkedIn job listings, Naukri (read through AmbitionBox, which shows Naukri's jobs), AmbitionBox,
#     Foundit, Hirist, iimjobs, Instahyre, TimesJobs, Shine, Cutshort, Wellfound, Internshala, Freshersworld,
#     Unstop, The Muse.
#   Companies: Google Careers and Google DeepMind (one reader), Apple, IBM, Goldman Sachs, Wipro and HCLTech
#     (SuccessFactors search API), MakeMyTrip, Uber (sitemap), Intuit and Cargill (TalentBrew).
# Readers that go against robots.txt on purpose (checked 2026-10-25): LinkedIn (its public job search),
# Foundit (/middleware/ search API), Google Careers (search result pages), Wipro and HCLTech (/services/ search
# API). The other new readers use pages robots.txt allows. All run at about one call a second.

# ============================== Job portals ==============================

- group: blocks_automated_access
  kind: portal
  reason: >-
    Blocked even a normal browser User-Agent on 2026-10-25: HTTP 403, a Cloudflare / Akamai bot check,
    or no answer. Getting past these needs a real browser, which this tool does not run.
  could_add: only with a headless browser (e.g. Playwright), and some would still challenge it
  names:
    - Indeed (403)
    - Glassdoor (403)
    - Naukri's own search API (asks for a reCAPTCHA; its jobs come in through AmbitionBox instead)
    - Startup Jobs (Cloudflare)
    - FlexJobs (no answer)
    - Remote.co (no answer)
    - Ruby on Remote (Cloudflare)
    - StepStone (403)
    - Totaljobs (403)
    - CareerOne (Cloudflare)
    - GrabJobs (Cloudflare)
    - ClearanceJobs (403)
    - SimplyHired (Cloudflare)
    - ZipRecruiter (Cloudflare)
    - Monster (403)
    - JobStreet and JobsDB (Cloudflare)
    - SEEK (403)
    - GulfTalent (Cloudflare)
    - Bayt (Cloudflare)
    - Naukrigulf (no answer)
    - Job Hai (no answer)
    - Jobted (JavaScript check)
    - F6S (bot check page)
    - Gun.io (bot check page)

- group: reachable_not_worth_a_reader
  kind: portal
  reason: >-
    Answered on 2026-10-25, but either almost no India tech jobs or no usable list. Left out to keep
    each scan short; each would be a small reader if wanted.
  could_add: yes, a reader each
  names:
    - Apna (public feed works but ignores search words, 7 jobs a page, almost all non-tech)
    - WorkIndia (blue-collar jobs)
    - JobGrin, Placement India, Fresherslive, eJobIndia (small or low-quality listings; not examined closely)
    - Firstnaukri (now redirects to Naukri's campus page)
    - Golang Cafe (has an India page, a handful of jobs)
    - Rust Jobs, JS Remotely, JustRemote, Dynamite Jobs, Flexa, Relocate.me, Arc (remote boards, few India jobs)
    - Welcome to the Jungle (Otta), CareerBuilder, Dice, TechFetch (US / Europe)
    - CV-Library, Reed, No Fluff Jobs, Jobrapido, Jora (UK / Europe / Australia; Jora's India site redirects)
    - Foundit Gulf (Gulf jobs)
    - Talent.com (pages answer; its API is for approved partners only)
    - Hired (now redirects to LHH)

- group: needs_candidate_login
  kind: portal
  reason: Jobs are only visible after a candidate logs in.
  could_add: no
  names: [Superset (campus placements)]

- group: freelance_marketplace
  kind: portal
  reason: Freelance marketplaces behind a login; their own hiring boards had no India jobs.
  could_add: no
  names: [Toptal, Arc, Contra, Gun.io, Lemon.io]

- group: wrong_region
  kind: portal
  reason: Almost no jobs open to people in India.
  could_add: no
  names:
