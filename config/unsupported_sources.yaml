# Companies and job portals this tool does NOT collect jobs from, and why.
# This file is a record only; the tool never reads it. Sources it does collect from are in sources.yaml.
# Checked 2026-10-23 to 2026-10-24. A site may change, so a "blocked" or "no API" entry can be re-checked later.
#
# Each group has a reason and the names it applies to. "could_add" says whether it can be added later and how.

# ============================== Job portals ==============================

- group: robots_txt_forbids
  kind: portal
  reason: Their robots.txt forbids automated collection, so they are left out on purpose.
  could_add: no
  names: [LinkedIn job listings (LinkedIn's own openings are collected), Indeed, Naukri, Hirist]

- group: blocks_automated_access
  kind: portal
  reason: Blocked automated access when checked (HTTP 403, a bot check or no answer).
  could_add: no
  names:
    - Foundit
    - Internshala
    - Instahyre
    - WorkIndia
    - Job Hai
    - JobGrin
    - Startup Jobs
    - FlexJobs
    - Remote.co
    - Golang Cafe
    - Rust Jobs
    - Ruby on Remote
    - StepStone
    - CV-Library
    - Totaljobs
    - CareerOne
    - GrabJobs
    - JobisJob
    - Naukrigulf
    - ClearanceJobs
    - Linux Foundation job board

- group: needs_api_key
  kind: portal
  reason: Official API exists but needs a free key you register for. These cover India.
  could_add: yes, once a key is registered and an adapter is written
  names: [Adzuna, Talent.com]    # Jooble and Careerjet were added 2026-10-24

- group: no_public_api
  kind: portal
  reason: Search web pages only; no public feed or API to read.
  could_add: no
