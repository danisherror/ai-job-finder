# Temporary: a full collect against Turso from GitHub, to time it. Sends no Telegram messages.
name: turso-speed
on:
  push:
    branches: [turso-hosting]
    paths: [.github/workflows/turso-speed.yml]
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Kolkata
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TURSO_REPLICA: private/replica/jobs.db
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python -m src.main collect --all
