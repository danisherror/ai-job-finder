name: turso-speed
on:
  push:
    branches: [turso-hosting]
    paths: [.github/bench/**, .github/workflows/turso-speed.yml]
jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python .github/bench/turso_speed.py
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PYTHONPATH: .
